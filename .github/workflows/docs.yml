name: Build and Deploy Documentation

on:
  push:
    branches:
      - main # Trigger on push to the main branch
      - feature/docs-ci # Also trigger when working on documentation features
  workflow_dispatch: # Allows manual trigger from the GitHub UI

# Permissions required to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Use the standard GitHub-hosted runner

    environment:
      # Specify the environment used for deployment
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # 1.  Run Unit Tests (Quality check before publishing)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Run Unit Tests
        # Executes the unit tests in test_main.py
        run: python3 tests/test_main.py
        
      # 2.  Doxygen Documentation Generation
      - name: Install Doxygen
        # Install Doxygen on the GitHub virtual server
        run: sudo apt-get update && sudo apt-get install -y doxygen 

      - name: Generate Doxygen Documentation
        # Run Doxygen using the Doxyfile configuration
        run: doxygen Doxyfile

      # 3.  Prepare for Deployment (GitHub Pages)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This path must match OUTPUT_DIRECTORY/HTML_OUTPUT in your Doxyfile
          path: 'docs/html' 

      # 4.  Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4