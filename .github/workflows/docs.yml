name: Build and Deploy Documentation

on:
  push:
    branches:
      - main # Trigger on push to the main branch
      - feature/docs-ci # Also trigger when working on documentation features
  workflow_dispatch: # Allows manual trigger from the GitHub UI

# Permissions required for checkout and pushing to a branch
permissions:
  contents: write # 'write' is required by peaceiris/actions-gh-pages
  pages: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Use the standard GitHub-hosted runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. Run Unit Tests (Quality check before publishing) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Unit Tests
        # Executes the unit tests in test_main.py
        run: |
          export PYTHONPATH=$PWD
          python3 tests/test_main.py
          
      # --- 2. Doxygen Documentation Generation ---
      - name: Install Doxygen
        # Install Doxygen on the GitHub virtual server
        run: sudo apt-get update && sudo apt-get install -y doxygen

      # *FIX/IMPROVEMENT:* Ensure the output directory exists before Doxygen runs.
      - name: Ensure Doxygen Output Directory Exists
        # This confirms 'docs' exists before Doxygen tries to write 'html' inside it.
        run: mkdir -p docs 

      - name: Generate Doxygen Documentation
        # Run Doxygen using the Doxyfile configuration
        # IMPORTANT: Check your Doxyfile to ensure OUTPUT_DIRECTORY = docs and HTML_OUTPUT = html
        run: doxygen Doxyfile

      # *FIX/IMPROVEMENT:* Debug Step to confirm files were created before deployment
      - name: Verify Doxygen Output Files
        # Check if the expected deployment directory (docs/html) contains any files.
        # This step will fail the workflow early if the directory is missing or empty,
        # providing a clearer error than the deploy step's exit code 100.
        run: |
          echo "Listing contents of the deployment directory: docs/html"
          ls -l docs/html
          # Fail if the directory is empty or doesn't exist.
          if [ ! -d "docs/html" ] || [ -z "$(ls -A docs/html)" ]; then
            echo "::error::The directory 'docs/html' is missing or empty. Doxygen failed to generate documentation."
            exit 1 # Exit with a standard failure code (not 100, which is specific to the action)
          fi
          
      # --- 3. Deploy Documentation to a separate branch (gh-pages) ---
      - name: Deploy to gh-pages Branch 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          # This token is automatically generated by GitHub
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The directory containing the built documentation - Must match Doxyfile settings!
          publish_dir: docs/html
          # The target branch for the documentation HTML files
          publish_branch: gh-pages
          # Recommended: Use a simple commit message
          commit_message: ${{ github.event.head_commit.message }}
